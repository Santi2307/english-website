<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#4f46e5" />

    <!-- SEO estático de la landing (visible para crawlers sin JS). Las páginas internas lo sobrescriben con react-helmet-async. -->
    <title>English Academy · Cursos de inglés online en Colombia</title>
    <meta name="description" content="Aprende inglés online desde el celular con clases cortas, test de nivel gratis y certificado. Paga en pesos con PSE, Nequi, tarjeta o Bancolombia." />
    <link rel="canonical" href="https://englishacademy.co/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:site_name" content="English Academy" />
    <meta property="og:title" content="Habla inglés con confianza · English Academy" />
    <meta property="og:description" content="Haz el test de nivel gratis y encuentra tu curso ideal. Paga con PSE o Nequi." />
    <meta property="og:image" content="https://englishacademy.co/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Foto del hero (LCP): se descarga en paralelo con el JS -->
    <link rel="preload" as="image" href="/images/people/hero-santi-sm.webp" media="(max-width: 640px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/people/hero-santi.webp" media="(min-width: 641px)" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "English Academy",
        "url": "https://englishacademy.co",
        "areaServed": "CO",
        "sameAs": []
      }
    </script>
  </head>
  <body>
    <noscript>Activa JavaScript para usar English Academy.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
